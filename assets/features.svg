<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title"><title id="title">Financial semantic permissions and objective-preserving scaling</title><rect width="1600" height="700" fill="#f7f6f5"/>
<text x="70" y="66" font-family="Consolas, sans-serif" font-size="24" fill="#2200ff">TWO DESIGN PRINCIPLES</text>
<line x1="70" y1="101" x2="1530" y2="101" stroke="#191919" stroke-width="2"/>
<text x="70" y="185" font-family="Consolas, sans-serif" font-size="27" fill="#2200ff">01</text>
<text x="205" y="189" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#191919">Financial semantic permissions</text>
<text x="205" y="250" font-family="Arial, sans-serif" font-size="29" fill="#666462">Define what should change. Define what should hold.</text>
<text x="205" y="310" font-family="Arial, sans-serif" font-size="28" fill="#191919">Investment stance</text>
<text x="480" y="310" font-family="Arial, sans-serif" font-size="34" fill="#2200ff">≠</text>
<text x="535" y="310" font-family="Arial, sans-serif" font-size="28" fill="#191919">Metric direction</text>
<text x="1160" y="189" font-family="Consolas, sans-serif" font-size="24" fill="#2200ff">SEMANTICS</text>
<text x="1160" y="247" font-family="Consolas, sans-serif" font-size="23" fill="#666462">target / holder</text>
<text x="1160" y="291" font-family="Consolas, sans-serif" font-size="23" fill="#666462">scope / context</text>
<line x1="70" y1="357" x2="1530" y2="357" stroke="#d7d4d1" stroke-width="2"/>
<text x="70" y="436" font-family="Consolas, sans-serif" font-size="27" fill="#2200ff">02</text>
<text x="205" y="440" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#191919">Objective-preserving scaling</text>
<text x="205" y="501" font-family="Arial, sans-serif" font-size="28" fill="#666462">One learning objective, from sample families to gradients.</text>
<text x="205" y="561" font-family="Arial, sans-serif" font-size="28" fill="#191919">Family weights  &gt;  Global loss  &gt;  Equivalent compute</text>
<text x="1160" y="440" font-family="Consolas, sans-serif" font-size="24" fill="#2200ff">EXECUTION</text>
<text x="1160" y="498" font-family="Consolas, sans-serif" font-size="23" fill="#666462">family / loss</text>
<text x="1160" y="542" font-family="Consolas, sans-serif" font-size="23" fill="#666462">gradient / state</text>
<line x1="70" y1="615" x2="1530" y2="615" stroke="#191919" stroke-width="2"/>
<text x="70" y="665" font-family="Consolas, sans-serif" font-size="23" fill="#2200ff">130U / MODELING &amp; ENGINEERING</text>
</svg>