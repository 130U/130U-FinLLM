<text x="900" y="682" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#2200ff">各阶段独立取数；A → B → C 的箭头表示权重传递</text>
<rect x="80" y="754" width="500" height="252" fill="#ffffff" stroke="#d7d4d1" stroke-width="1"/>
<rect x="80" y="754" width="4" height="252" fill="#191919"/>
<text x="106" y="788" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">A / BASE PRETRAINING</text>
<text x="106" y="836" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#191919">基础语言训练</text>
<text x="106" y="877" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">50B tokens 配方 / 65,536 词表</text>
<text x="106" y="912" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">随机初始化：28 层、hidden 2,560</text>
<text x="106" y="947" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">Q20 / KV4 · SwiGLU · tied embedding</text>
<rect x="710" y="754" width="500" height="252" fill="#ffffff" stroke="#d7d4d1" stroke-width="1"/>
<rect x="710" y="754" width="4" height="252" fill="#2200ff"/>
<text x="736" y="788" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">B / MIXED ADAPTATION</text>
<text x="736" y="836" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#191919">金融混合适配</text>
<text x="736" y="877" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">4.0B 金融 + 0.75B 通用保持</text>
<text x="736" y="912" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">0.20B 阅读 QA + 0.05B 立场 / 事件</text>
<text x="736" y="947" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">各流 loss mask、抽样与权重分别管理</text>
<rect x="1340" y="754" width="500" height="252" fill="#ffffff" stroke="#d7d4d1" stroke-width="1"/>
<rect x="1340" y="754" width="4" height="252" fill="#2200ff"/>
<text x="1366" y="788" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">C / TASK TRAINING</text>
<text x="1366" y="836" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#191919">目标条件化 SFT</text>
<text x="1366" y="877" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">目标 / 持有人 / 证据范围条件化</text>
<text x="1366" y="912" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">立场与指标方向采用不同任务前缀</text>
<text x="1366" y="947" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">逐轴语义许可接入监督与配对约束</text>
