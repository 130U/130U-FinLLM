<text x="80" y="310" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">01 / DATA CONTRACT</text>
<rect x="80" y="346" width="500" height="232" fill="#ffffff" stroke="#d7d4d1" stroke-width="1"/>
<rect x="80" y="346" width="4" height="232" fill="#191919"/>
<text x="106" y="380" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">SOURCES</text>
<text x="106" y="428" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#191919">两类个人材料 + 基础语料</text>
<text x="106" y="469" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">本人原创历史观点 / 本人审核公开文本</text>
<text x="106" y="504" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">通用语言语料 / 金融原文</text>
<text x="106" y="539" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">保留作者、标注者和真实可得时间</text>
<rect x="710" y="346" width="500" height="232" fill="#ffffff" stroke="#d7d4d1" stroke-width="1"/>
<rect x="710" y="346" width="4" height="232" fill="#191919"/>
<text x="736" y="380" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">PROTOCOL</text>
<text x="736" y="428" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#191919">定义判断对象与证据范围</text>
<text x="736" y="469" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">task / target / holder / scope</text>
<text x="736" y="504" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">原文立场、事件方向、个人判断分开</text>
<text x="736" y="539" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">来源、事件与派生记录归入 family</text>
<rect x="1340" y="346" width="500" height="232" fill="#ffffff" stroke="#d7d4d1" stroke-width="1"/>
<rect x="1340" y="346" width="4" height="232" fill="#2200ff"/>
<text x="1366" y="380" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">PARTITION</text>
<text x="1366" y="428" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#191919">先分区，再生成训练视图</text>
<text x="1366" y="469" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">32k gold 配额：12k train + 20k 验收</text>
<text x="1366" y="504" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">教师监督与审核编辑仅进入训练区</text>
<text x="1366" y="539" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#666462">同一 family 及其全部视图保持同区</text>
