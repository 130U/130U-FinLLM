<title id="title">130U-FinLLM 2.4B 训练全流程</title><desc id="desc">130U-FinLLM. 2.4B private-use financial language model and public 24M Trial. Editable vector system architecture.</desc>
<rect x="0" y="0" width="1920" height="1600" fill="#f7f6f5"/>
<text x="80" y="63" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">130U / TRAINING SYSTEM / PRIVATE MODEL</text>
<text x="80" y="144" font-family="Microsoft YaHei, sans-serif" font-size="58" font-weight="700" fill="#191919">从个人语料到金融判断</text>
<text x="82" y="195" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#666462">2.4B 自用金融语言模型 · 从数据到判断的完整训练体系</text>
<text x="1480" y="164" font-family="Bahnschrift, sans-serif" font-size="106" fill="#191919">2.4B</text>
<text x="1484" y="209" font-family="Consolas, sans-serif" font-size="19" fill="#666462">130U / FINANCIAL LLM</text>
