<rect x="1240" y="650" width="4" height="240" fill="#2200ff"/>
<text x="1266" y="684" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">FULL VOCABULARY</text>
<text x="1266" y="732" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#191919">Tied projection + exact CE</text>
<text x="1266" y="773" font-family="Arial, sans-serif" font-size="22" fill="#666462">logits [M, 65536]</text>
<text x="1266" y="808" font-family="Arial, sans-serif" font-size="22" fill="#666462">Full-vocabulary normalization</text>
<text x="1266" y="843" font-family="Arial, sans-serif" font-size="22" fill="#666462">Chunk or fuse; do not replace with 3-class CE</text>
<text x="1266" y="878" font-family="Arial, sans-serif" font-size="22" fill="#666462">gold IDs &lt; supervision side channel</text>
