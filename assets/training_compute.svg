<text x="650" y="384" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">SHARED DECODER / 28 LAYERS</text>
<text x="685" y="499" font-family="Bahnschrift, sans-serif" font-size="27" fill="#191919">Transformer block x 28</text>
<text x="650" y="608" font-family="Consolas, sans-serif" font-size="31" fill="#2200ff">H [B, S, 2560]</text>
<text x="650" y="651" font-family="Arial, sans-serif" font-size="23" fill="#666462">Segmented causal attention / position IDs</text>
