<rect x="1340" y="1030" width="4" height="220" fill="#191919"/>
<text x="1366" y="1064" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">OPTIMIZER STEP</text>
<text x="1366" y="1112" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#191919">Backpropagation and update</text>
<text x="1366" y="1153" font-family="Arial, sans-serif" font-size="22" fill="#666462">Normalize stream CE and permitted losses</text>
<text x="1366" y="1188" font-family="Arial, sans-serif" font-size="22" fill="#666462">Count updates, skipped steps, and exposure</text>
<text x="1366" y="1223" font-family="Arial, sans-serif" font-size="22" fill="#666462">Shared checks for precision, sharding, resume</text>
