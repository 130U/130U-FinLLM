<text x="660" y="895" font-family="Consolas, sans-serif" font-size="20" fill="#2200ff">S/E: q = softmax(label logits)</text>
<rect x="80" y="1030" width="500" height="220" fill="#ffffff" stroke="#d7d4d1" stroke-width="1"/>
<rect x="80" y="1030" width="4" height="220" fill="#2200ff"/>
<text x="106" y="1064" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">PERMITTED PAIRS</text>
<text x="106" y="1112" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#191919">Apply only permitted constraints</text>
<text x="106" y="1153" font-family="Arial, sans-serif" font-size="22" fill="#666462">Three-label distributions / ends / permissions</text>
<text x="106" y="1188" font-family="Arial, sans-serif" font-size="22" fill="#666462">Gate valid pairs; account within family</text>
<text x="106" y="1223" font-family="Arial, sans-serif" font-size="22" fill="#666462">Correct labels anchor both endpoints</text>
<rect x="710" y="1030" width="500" height="220" fill="#ffffff" stroke="#d7d4d1" stroke-width="1"/>
<rect x="710" y="1030" width="4" height="220" fill="#2200ff"/>
<text x="736" y="1064" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">GLOBAL OBJECTIVE</text>
<text x="736" y="1112" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#191919">Global denominators per term</text>
<text x="736" y="1153" font-family="Arial, sans-serif" font-size="22" fill="#666462">raw / QA: declared supervision units</text>
<text x="736" y="1188" font-family="Arial, sans-serif" font-size="22" fill="#666462">S/E and pairs: average within each family</text>
<text x="736" y="1223" font-family="Arial, sans-serif" font-size="22" fill="#666462">family / stream / lambda &lt; side channel</text>
