<text x="1360" y="1297" font-family="Arial, sans-serif" font-size="18" fill="#666462">One optimizer attempt; successful updates counted separately</text>
<polyline points="80,1350 1840,1350" fill="none" stroke="#191919" stroke-width="1.5"/>
<text x="80" y="1397" font-family="Consolas, sans-serif" font-size="24" fill="#2200ff">EQUIVALENCE FIRST</text>
<text x="535" y="1397" font-family="Arial, sans-serif" font-size="23" fill="#191919">Same batch: compare logits, loss, gradients, and parameter deltas before memory or throughput.</text>
<text x="80" y="1455" font-family="Arial, sans-serif" font-size="21" fill="#666462">Every runtime optimization preserves supervision, sample boundaries, and training-state semantics.</text>
