<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1510" viewBox="0 0 1920 1510" role="img" aria-labelledby="title"><title id="title">Core training computation</title>
<rect x="0" y="0" width="1920" height="1510" fill="#f7f6f5"/>
<text x="80" y="63" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">130U / COMPUTE SYSTEM / OBJECTIVE INTEGRITY</text>
<text x="80" y="144" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#191919">One objective, from data to runtime</text>
<text x="82" y="195" font-family="Arial, sans-serif" font-size="24" fill="#666462">Semantic permissions | Family accounting | Objective-preserving execution</text>
<text x="1480" y="164" font-family="Bahnschrift, sans-serif" font-size="106" fill="#191919">28 L</text>
<text x="1484" y="209" font-family="Consolas, sans-serif" font-size="19" fill="#666462">130U / FINANCIAL LLM</text>
