<text x="80" y="307" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">01 / INPUTS &amp; ISOLATION</text>
<text x="1240" y="307" font-family="Arial, sans-serif" font-size="19" fill="#666462">Solid: computed values    Dashed: supervision and boundaries</text>
