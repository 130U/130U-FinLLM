<rect x="80" y="350" width="4" height="218" fill="#191919"/>
<text x="106" y="384" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">MODEL INPUT</text>
<text x="106" y="432" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#191919">Build stream-specific inputs</text>
<text x="106" y="473" font-family="Arial, sans-serif" font-size="20" fill="#666462">raw: source text / QA: question prompt</text>
<text x="106" y="508" font-family="Arial, sans-serif" font-size="22" fill="#666462">S/E: target / holder / evidence scope</text>
<text x="106" y="543" font-family="Arial, sans-serif" font-size="19" fill="#666462">Keep the predicted judgment out of input</text>
<rect x="80" y="646" width="400" height="244" fill="#ffffff" stroke="#d7d4d1" stroke-width="1"/>
<rect x="80" y="646" width="4" height="244" fill="#2200ff"/>
<text x="106" y="680" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">AUDIT SIDE CHANNEL</text>
<text x="106" y="728" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#191919">Supervision and boundaries</text>
<text x="106" y="769" font-family="Arial, sans-serif" font-size="22" fill="#666462">gold / family / stream / pair IDs</text>
<text x="106" y="804" font-family="Arial, sans-serif" font-size="22" fill="#666462">loss mask / pair gate / weights</text>
<text x="106" y="839" font-family="Arial, sans-serif" font-size="22" fill="#666462">Segment IDs control attention</text>
<text x="106" y="874" font-family="Arial, sans-serif" font-size="18" fill="#666462">Keep audited labels out of model prompts</text>
