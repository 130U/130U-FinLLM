<text x="1266" y="384" font-family="Consolas, sans-serif" font-size="19" fill="#2200ff">VALID POSITIONS</text>
<text x="1266" y="432" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#191919">Select supervised positions</text>
<text x="1266" y="473" font-family="Arial, sans-serif" font-size="22" fill="#666462">H_valid [M, 2560]</text>
<text x="1266" y="508" font-family="Arial, sans-serif" font-size="22" fill="#666462">Single label: one position per task view</text>
<text x="1266" y="543" font-family="Arial, sans-serif" font-size="22" fill="#666462">QA / LM: retain all valid target positions</text>
<polyline points="1110,454 1240,454" fill="none" stroke="#2200ff" stroke-width="2"/>
<polyline points="1232.1017569429866,458.3148298474378 1240,454 1232.1017569429866,449.6851701525622" fill="none" stroke="#2200ff" stroke-width="2"/>
