[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finllm-130u"
version = "0.1.0"
description = "130U FinLLM: an English financial stance language model trained from scratch"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "tokenizers>=0.21,<0.23", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
data = ["datasets>=3.6,<5", "beautifulsoup4>=4.12,<5", "requests>=2.32,<3"]
test = ["pytest>=8,<10", "nbformat>=5.10,<6", "beautifulsoup4>=4.12,<5"]

[project.scripts]
finllm = "finllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
